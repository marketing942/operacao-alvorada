<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>og-card</title>
<!-- Fonte do og:image. Renderizado por scripts/gerar-social.py em 1200x630,
     que é a proporção 1.91:1 pedida por WhatsApp, Facebook, LinkedIn e X.
     Editar aqui e rodar o script regera public/og-alvorada.png. -->
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0A0A0B; color: #E8E4D9; font-family: 'Rajdhani', sans-serif;
  }
  .bg {
    position: absolute; inset: 0;
    background: url('../public/bgatirador.webp') center right / cover no-repeat;
    transform: scaleX(-1); opacity: .5; filter: grayscale(.35) contrast(1.05);
  }
  .veu {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(10,10,11,.97) 0%, rgba(10,10,11,.9) 38%, rgba(10,10,11,.35) 70%, rgba(10,10,11,.7) 100%),
      radial-gradient(ellipse at 20% 120%, rgba(175,146,86,.3), transparent 60%);
  }
  .borda { position: absolute; inset: 0; border-top: 6px solid #AF9256; }
  /* padding-right reservado para o brasão: sem isso o título passa por baixo
     dele e a ficha é empurrada para fora do cartão. */
  .conteudo { position: relative; z-index: 2; padding: 54px 70px; padding-right: 400px; height: 100%; display: flex; flex-direction: column; }

  /* O brasão ocupa a direita do cartão — é o lado que estava só com a foto.
     Quem compartilha o link leva a marca junto, não só a manchete. */
  .brasao {
    position: absolute; z-index: 3; right: 54px; top: 50%;
    transform: translateY(-50%); width: 310px;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.75)) drop-shadow(0 0 40px rgba(175,146,86,.35));
  }

  /* align-self obrigatório: .conteudo é flex em coluna, e o align-items:stretch
     padrão esticaria a imagem até a largura toda, achatando o logo. */
  .logo { align-self: flex-start; height: 54px; width: auto; margin-bottom: 28px; }

  .tag {
    display: inline-flex; align-items: center; gap: 10px; align-self: flex-start;
    padding: 8px 16px; margin-bottom: 20px;
    background: rgba(175,146,86,.12); box-shadow: inset 0 0 0 1px rgba(175,146,86,.55);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    font-size: 15px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #C9AE7A;
  }
  .tag i { width: 8px; height: 8px; border-radius: 50%; background: #AF9256; }

  h1 {
    font-family: 'Oxanium', sans-serif; font-size: 54px; font-weight: 800;
    line-height: .96; letter-spacing: -.5px; text-transform: uppercase;
    text-shadow: 0 8px 40px rgba(0,0,0,.8);
  }
  h1 span {
    background: linear-gradient(180deg, #F0DCB0, #AF9256 55%, #8A7040);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .ficha { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .ficha div {
    padding: 11px 16px;
    background: linear-gradient(180deg, rgba(24,24,30,.85), rgba(12,12,15,.9));
    box-shadow: inset 0 0 0 1px rgba(175,146,86,.28);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .ficha span {
    display: block; font-size: 12px; font-weight: 700; letter-spacing: 2.6px;
    text-transform: uppercase; color: #87847A; margin-bottom: 4px;
  }
  .ficha b {
    display: block; font-family: 'Oxanium', sans-serif; 
    font-weight: 700; color: #C9AE7A; letter-spacing: .4px; font-size: 17px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veu"></div>
  <div class="borda"></div>

  <img class="brasao" src="../public/brasao-alvorada.webp" alt="Operação Alvorada — A Ascensão">

  <div class="conteudo">
    <img class="logo" src="../public/logo-cppem.png" alt="CPPEM">

    <span class="tag"><i></i> 11ª edição · A Ascensão</span>

    <h1>Enquanto a cidade dorme,<br>você conquista a <span>farda</span>.</h1>

    <div class="ficha">
      <div><span>Data</span><b>26 e 27 de setembro</b></div>
      <div><span>Horário</span><b>19h00 às 07h00</b></div>
      <div><span>Local</span><b>Sede CPPEM</b></div>
      <div><span>Foco</span><b>PMPE e PCPE</b></div>
    </div>
  </div>
</body>
</html>
